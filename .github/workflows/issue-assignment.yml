name: Issue assignment

# Contributors comment /assign to take an issue and /unassign to release it; plain-language
# requests ("can I work on this?") get a reply pointing to /assign.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-assignment-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  assignment:
    # issues only (not pull requests), and not the bot's own replies
    if: >-
      !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/issue-assignment.js');
            await run({ github, context });
